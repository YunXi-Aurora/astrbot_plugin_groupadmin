<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" role="img" aria-labelledby="permTitle permDesc">
  <title id="permTitle">四级权限模型</title>
  <desc id="permDesc">自上而下四级：AstrBot 超级管理员拥有全部权限与各群名单管理；特殊权限名单成员可执行本群全部群管指令且不受群主身份限制；QQ 群主与管理员可执行基础管理与查询；普通成员仅可查询群友信息、群公告与群文件。</desc>

  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E17"/>
      <stop offset="1" stop-color="#121C2E"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="22" fill="url(#pbg)"/>
  <rect x="0" y="0" width="6" height="400" fill="#12B7F5"/>

  <text x="56" y="60" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#F2F6FC">四级权限模型</text>
  <text x="56" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#71809A">层级越高权限越大 · 每群名单独立生效</text>

  <!-- 行 1 -->
  <rect x="56" y="118" width="1088" height="56" rx="10" fill="#16223A" stroke="#22304A" stroke-width="1"/>
  <rect x="56" y="118" width="5" height="56" rx="2.5" fill="#F5C25B"/>
  <text x="84" y="152" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#F2F6FC">AstrBot 超级管理员</text>
  <text x="368" y="152" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#A9B8CC">一切权限，含各群特殊权限名单管理</text>
  <rect x="986" y="134" width="136" height="26" rx="13" fill="#2A2413"/>
  <text x="1000" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#F5C25B">全部 44 + 名单</text>

  <!-- 行 2 -->
  <rect x="56" y="182" width="1088" height="56" rx="10" fill="#16223A" stroke="#22304A" stroke-width="1"/>
  <rect x="56" y="182" width="5" height="56" rx="2.5" fill="#12B7F5"/>
  <text x="84" y="216" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#F2F6FC">特殊权限名单成员</text>
  <text x="368" y="216" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#A9B8CC">本群全部群管指令，无需群主 / 管理员身份</text>
  <rect x="986" y="198" width="136" height="26" rx="13" fill="#0F2A3A"/>
  <text x="1000" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#12B7F5">群管全指令</text>

  <!-- 行 3 -->
  <rect x="56" y="246" width="1088" height="56" rx="10" fill="#141C2C" stroke="#1F2B40" stroke-width="1"/>
  <rect x="56" y="246" width="5" height="56" rx="2.5" fill="#5C8FD6"/>
  <text x="84" y="280" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" fill="#DCE5F0">QQ 群主 / 管理员</text>
  <text x="368" y="280" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#8D9CB2">本群基础管理指令 + 查询指令</text>
  <rect x="986" y="262" width="136" height="26" rx="13" fill="#172335"/>
  <text x="1000" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#7FA3D8">基础管理 + 查询</text>

  <!-- 行 4 -->
  <rect x="56" y="310" width="1088" height="56" rx="10" fill="#111926" stroke="#1B2537" stroke-width="1"/>
  <rect x="56" y="310" width="5" height="56" rx="2.5" fill="#44526B"/>
  <text x="84" y="344" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" fill="#A9B8CC">普通成员</text>
  <text x="368" y="344" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#7C8AA0">仅查询：群友信息 / 群公告 / 群文件</text>
  <rect x="986" y="326" width="136" height="26" rx="13" fill="#151E2D"/>
  <text x="1000" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#7C8AA0">仅 3 项查询</text>

  <text x="56" y="390" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#54637A">名单成员自身不受保护：仍可能被禁言或踢出</text>
</svg>