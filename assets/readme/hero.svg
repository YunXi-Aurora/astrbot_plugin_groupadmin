<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">QQ 群管（重构版）· 特殊权限名单制</title>
  <desc id="heroDesc">左侧是插件名称与核心承诺：每群独立的特殊权限名单，名单成员无需群主身份即可执行全部群管指令。右侧是真实使用现场：发送「禁言 @小明 1h30m」，插件换算为 5400 秒并在群内回执「用户[小明]已被禁言1小时30分钟」。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E17"/>
      <stop offset="1" stop-color="#121C2E"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12B7F5"/>
      <stop offset="1" stop-color="#0C6FA8"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.4" fill="#1A2638"/>
    </pattern>
    <clipPath id="panelClip"><rect x="688" y="58" width="452" height="304" rx="16"/></clipPath>
  </defs>

  <rect width="1200" height="420" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="22" fill="url(#dots)"/>
  <rect x="0" y="0" width="6" height="420" fill="url(#accentBar)"/>

  <!-- 左栏：身份与承诺 -->
  <text x="64" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="2.6" fill="#12B7F5">ASTRBOT PLUGIN · ONEBOT + QQ 官方</text>

  <text x="62" y="186" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="70" font-weight="700" fill="#F2F6FC">QQ 群管</text>
  <text x="376" y="186" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="38" font-weight="400" fill="#5A6A80">重构版</text>

  <text x="64" y="234" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#71809A">astrbot_plugin_groupadmin</text>

  <rect x="64" y="262" width="4" height="74" rx="2" fill="#12B7F5"/>
  <text x="86" y="290" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#D5DEEA">特殊权限名单制：每群独立授权，</text>
  <text x="86" y="322" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#D5DEEA">名单成员不必是群主，也能执行全部群管指令。</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#8494A9">
    <text x="64" y="384">44 命令</text>
    <text x="188" y="384" fill="#33415A">·</text>
    <text x="214" y="384">21 LLM 工具</text>
    <text x="330" y="384" fill="#33415A">·</text>
    <text x="356" y="384">GPL-3.0</text>
    <text x="436" y="384" fill="#33415A">·</text>
    <text x="462" y="384">AstrBot 4.24.2+</text>
  </g>

  <!-- 右栏：真实命令与回执 -->
  <rect x="688" y="58" width="452" height="304" rx="16" fill="#0E1522" stroke="#1E2C42" stroke-width="1.5"/>
  <path d="M688 74a16 16 0 0 1 16-16h420a16 16 0 0 1 16 16v34H688z" fill="#131D2E"/>
  <circle cx="716" cy="83" r="5" fill="#2C3C54"/>
  <circle cx="734" cy="83" r="5" fill="#2C3C54"/>
  <circle cx="752" cy="83" r="5" fill="#2C3C54"/>
  <text x="778" y="89" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#69788E">群聊 · 特殊权限名单成员</text>

  <g clip-path="url(#panelClip)">
    <!-- 用户指令 -->
    <rect x="712" y="126" width="404" height="50" rx="10" fill="#101B2C" stroke="#1C2A3E" stroke-width="1"/>
    <circle cx="736" cy="151" r="11" fill="#12B7F5" opacity="0.16"/>
    <text x="731" y="157" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#12B7F5">/</text>
    <text x="758" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#EAF1FA">禁言 @小明 1h30m</text>

    <!-- 换算标注 -->
    <path d="M762 180 L762 194 L880 194" stroke="#243450" stroke-width="1.5" fill="none"/>
    <circle cx="880" cy="194" r="2.6" fill="#243450"/>
    <text x="892" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#71809A">换算 → 5400 秒</text>

    <!-- 机器人回执 -->
    <rect x="712" y="216" width="404" height="50" rx="10" fill="#0F2418" stroke="#1D4230" stroke-width="1"/>
    <circle cx="736" cy="241" r="11" fill="#3ECF8E" opacity="0.16"/>
    <text x="730" y="247" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#3ECF8E">✓</text>
    <text x="758" y="248" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#B9F0D4">用户[小明]已被禁言1小时30分钟</text>

    <!-- 等价写法 -->
    <text x="712" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#5C6B82">等价写法</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#9AABC2">
      <rect x="796" y="283" width="72" height="26" rx="13" fill="#16223A"/>
      <text x="812" y="301">90秒</text>
      <rect x="876" y="283" width="58" height="26" rx="13" fill="#16223A"/>
      <text x="892" y="301">90s</text>
      <rect x="942" y="283" width="90" height="26" rx="13" fill="#16223A"/>
      <text x="956" y="301">1.5分钟</text>
      <rect x="1040" y="283" width="56" height="26" rx="13" fill="#16223A"/>
      <text x="1056" y="301">90</text>
    </g>
  </g>

  <text x="712" y="340" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#51607A">周 / 天 / 小时 / 分钟 / 秒 · 支持复合与小数</text>
</svg>